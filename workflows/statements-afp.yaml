# Statement run from AFP: split a billing print file into one AFP document per customer, take
# each statement's index from its TLEs, presort by zip, and write the results out. The same run
# as statements.yaml, for files written by `generate-afp`.
#
#   ./mvnw -q exec:java -Dexec.args="run workflows/statements-afp.yaml *.afp"
name: statements-afp
description: Split an AFP statement run on its page groups, index from TLEs, and presort

# Steps are grouped into ProcessDirector's six phases, which always run in this order: receive,
# prepare, assemble, print, insert, complete. A phase may be empty ([]) or left out; the job's
# phase is shown in job.json and error.txt.
phases:
  receive:
    # Job ticket: <input>.jobprops (copied into the hot folder before the input) sets job
    # properties, one name=value per line. No ticket, no change. See README "Job tickets".
    - name: set-job-props
      type: SetJobPropsFromTextFile

  prepare:
    # One document per named page group (BNG ... ENG). Its TLEs become document properties, plus
    # pageCount and format. No page regions: AFP carries the index itself.
    - name: split-and-index
      type: SplitAfp
      params:
        # A group without one of these (or with it blank) is marked indexError, not failed, so the
        # route step can send it to the exception queue while the rest of the job completes.
        requiredProperties: [accountNumber, name, zip]
        # What sits between the fields in the file: strict (the default; nothing), padded (CR/LF
        # or zero bytes), rdw or bdw (record or block descriptor words, as copied from a
        # mainframe), or auto to work it out. See README "Splitting AFP".
        # framing: strict
        # Which nesting depth of page group is a document: 1 (the default) is a group outside any
        # other. With 2, the groups around them (a household, say) are wrapped around each
        # document and their TLEs are inherited. See README "Splitting AFP".
        # groupLevel: 1

    - name: route
      type: RouteDocuments
      params:
        routes:
          # A missing TLE (indexError) or a bad zip can't be mailed.
          - queue: exceptions
            when: { any: [ { property: indexError, operator: matches, value: '.+' },
                           { property: zip, operator: notMatches, value: '\d{5}' } ] }
          - queue: large-envelope
            when: { property: pageCount, operator: greaterThan, value: 6 }
        default: standard

    - name: presort
      type: SortDocuments
      params:
        by: zip

  assemble: []

  print:
    - name: write-output
      type: WriteOutput
      params:
        outputDir: output

  insert: []

  complete: []
