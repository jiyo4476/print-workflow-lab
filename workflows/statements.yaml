# Statement run: split a billing print file into one PDF per customer,
# index each statement, presort by zip, and write the results out.
name: statements
description: Split, index, and presort a customer statement print run

# Steps are grouped into ProcessDirector's six phases, which always run in this order: receive,
# prepare, assemble, print, insert, complete. A phase may be empty ([]) or left out; the job's
# phase is shown in job.json and error.txt.
phases:
  receive:
    # Job ticket: <input>.jobprops (copied into the hot folder before the input) sets job
    # properties, one name=value per line. No ticket, no change. See README "Job tickets".
    - name: set-job-props
      type: SetJobPropsFromTextFile

  prepare:
    - name: split-and-index
      type: SplitPdf
      params:
        # A new statement starts whenever the account number in the page header changes...
        splitOn: accountNumber
        # What reads the region text: pdfbox, or builtin (this project's own PDF reader; simple
        # fonts only, so a page with a CID font fails the job). See README "Text positions".
        extractor: pdfbox
        # ...or on a "Page 1 of N" page, so two statements in a row for the same account (a
        # corrected statement, say) aren't merged into one.
        newDocumentWhen: { property: pageNumber, operator: matches, value: 'Page 1 of \d+' }
        # [x, y, width, height] in points from the top-left of the page.
        # These match the layout written by StatementPdfGenerator.
        regions:
          accountNumber: [395, 28, 130, 18]
          name:          [70, 108, 260, 16]
          street:        [70, 122, 260, 16]
          cityStateZip:  [70, 136, 260, 16]
          zip:           [495, 138, 70, 14]
          pageNumber:    [395, 44, 130, 14]

    # Decide where each statement goes. Routes are checked in order; the first match wins.
    - name: route
      type: RouteDocuments
      params:
        routes:
          # Bad addresses can't be mailed: send them to the exception queue.
          # In a double-quoted YAML string a backslash must be doubled, so "\\d{5}" is the regex
          # \d{5} (exactly five digits). Single quotes need no escaping: '\d{5}'.
          - queue: exceptions
            when: { any: [ { property: zip, operator: notMatches, value: "\\d{5}" },
                           { property: name, operator: missing } ] }
          # Too many sheets for a standard envelope.
          - queue: large-envelope
            when: { property: pageCount, operator: greaterThan, value: 6 }
        default: standard

    - name: presort
      type: SortDocuments
      params:
        by: zip
      # Any step can take a 'when' on job properties; it's skipped (and recorded as SKIPPED) when
      # false. Here a job ticket line "presort=false" (or no / off, in any case) turns
      # presorting off for that job. (An absent property matches nothing, so jobs without a
      # ticket are presorted.)
      when: { property: presort, operator: notMatches, value: "(?i)false|no|off" }

  assemble: []

  # "Printing" here means writing each queue's documents to the output folder, the way a
  # directory (hot-folder) printer would receive them.
  print:
    # Stamp the inserter barcode on every page, after presort, so ${sequence} is the mailing
    # position. The symbol sits in the bottom-left margin, clear of the regions above.
    - name: inserter-barcode
      type: AddBarcode
      params:
        template: '${jobId}|${sequence}|${page}|${pageCount}|${accountNumber}'
        position: [72, 700]
        size: [72, 72]
    - name: write-output
      type: WriteOutput
      params:
        outputDir: output

  insert: []

  complete: []
    # Example external step (runs in the job's work directory):
    # - name: notify
    #   type: RunExternalProgram
    #   params:
    #     command: ["bash", "-c", "echo processed ${jobId} > done.txt"]
    #     timeoutSeconds: 30
