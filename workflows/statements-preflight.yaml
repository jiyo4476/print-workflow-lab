# Statement run with print-readiness checks: the statements workflow, plus a PreflightPdf step
# after the split. A document that fails preflight goes to the exceptions queue with its issues in
# documents.csv (preflight, preflightIssues). See PRD-11.
name: statements-preflight
description: Split, check print-readiness, index, presort, and write a customer statement run

phases:
  receive:
    - name: set-job-props
      type: SetJobPropsFromTextFile

  prepare:
    - name: split-and-index
      type: SplitPdf
      params:
        splitOn: accountNumber
        extractor: pdfbox
        newDocumentWhen: { property: pageNumber, operator: matches, value: 'Page 1 of \d+' }
        regions:
          accountNumber: [395, 28, 130, 18]
          name:          [70, 108, 260, 16]
          street:        [70, 122, 260, 16]
          cityStateZip:  [70, 136, 260, 16]
          zip:           [495, 138, 70, 14]
          pageNumber:    [395, 44, 130, 14]

    # Check each statement file before it is routed.
    - name: preflight
      type: PreflightPdf
      params:
        maxVersion: "1.7"
        # Strict font check (the default): every font must be embedded. The statement generator
        # embeds Liberation Sans, so its files pass. Set allowStandard14: true only for customer
        # files that rely on a viewer's Standard 14 fonts (Helvetica, Times, Courier, ...).
        pageSizes: [letter]
        failJob: false

    - name: route
      type: RouteDocuments
      params:
        routes:
          # Preflight failures can't be printed as supplied: send them to exceptions.
          - queue: exceptions
            when: { property: preflight, operator: matches, value: fail }
          - queue: exceptions
            when: { any: [ { property: zip, operator: notMatches, value: "\\d{5}" },
                           { property: name, operator: missing } ] }
          - queue: large-envelope
            when: { property: pageCount, operator: greaterThan, value: 6 }
        default: standard

    - name: presort
      type: SortDocuments
      params:
        by: zip
      when: { property: presort, operator: notMatches, value: "(?i)false|no|off" }

  assemble: []

  print:
    - name: write-output
      type: WriteOutput
      params:
        outputDir: output

  insert: []

  complete: []
