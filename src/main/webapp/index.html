<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Workflow Lab</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>

  <!-- Libraries, from WebJars (versions pinned in pom.xml). Load order matters: Marionette 4's
       browser build reads the jQuery, _ and Backbone(.Radio) globals. -->
  <script src="webjars/jquery/3.7.1/dist/jquery.js"></script>
  <script src="webjars/underscore/1.13.8/underscore-umd.js"></script>
  <script src="webjars/backbone/1.6.0/backbone.js"></script>
  <script src="webjars/backbone.radio/2.0.0/build/backbone.radio.js"></script>
  <script src="webjars/backbone.marionette/4.1.3/lib/backbone.marionette.js"></script>

  <!-- Application: entities, then controllers, views, router and app. Each file only defines
       things; nothing is started until main.js runs. -->
  <script src="js/entities/job.js"></script>
  <script src="js/entities/document.js"></script>
  <script src="js/entities/structure.js"></script>
  <script src="js/health.js"></script>
  <script src="js/controllers/jobs.js"></script>
  <script src="js/controllers/search.js"></script>
  <script src="js/controllers/structure.js"></script>
  <script src="js/views/shared.js"></script>
  <script src="js/views/jobs.js"></script>
  <script src="js/views/documents.js"></script>
  <script src="js/views/search.js"></script>
  <script src="js/views/structure.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
